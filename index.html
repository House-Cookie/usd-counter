<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contador de dólares</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
  :root {
    --fondo: #e8edf1;
    --papel: #f7f9fa;
    --tinta: #12343b;
    --tinta-suave: #5d7479;
    --linea: #c9d4d9;
    --suma: #2b7a58;
    --suma-fondo: #dcefe5;
    --resta: #b0402e;
    --resta-fondo: #f6e0db;
    --fuente: "Bricolage Grotesque", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-tema="claro"]) {
      --fondo: #0f1d21;
      --papel: #172b30;
      --tinta: #e3eef0;
      --tinta-suave: #8fa8ad;
      --linea: #2c474d;
      --suma: #5fc596;
      --suma-fondo: #1b3a2f;
      --resta: #ee8b79;
      --resta-fondo: #3d2420;
    }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--fondo);
    color: var(--tinta);
    font-family: var(--fuente);
    min-height: 100vh;
    padding: 32px 20px 56px;
  }
  main { max-width: 720px; margin: 0 auto; }

  h1 {
    font-size: 1.15rem;
    font-weight: 600;
    margin: 0 0 20px;
    color: var(--tinta-suave);
  }

  /* Saldo: signo a la izquierda, cuadro a la derecha */
  .saldo {
    display: grid;
    grid-template-columns: auto 1fr;
    align-items: stretch;
    gap: 16px;
  }
  .signo {
    font-size: clamp(5rem, 22vw, 9rem);
    font-weight: 800;
    line-height: 1;
    display: flex;
    align-items: center;
    color: var(--suma);
    user-select: none;
  }
  .cuadro {
    background: var(--papel);
    border: 2px solid var(--tinta);
    border-radius: 6px;
    padding: 22px 24px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    min-width: 0;
  }
  .cuadro small { color: var(--tinta-suave); font-size: .9rem; margin-bottom: 4px; }
  #saldo {
    font-size: clamp(2rem, 9vw, 3.8rem);
    font-weight: 800;
    line-height: 1.05;
    font-variant-numeric: tabular-nums;
    overflow-wrap: anywhere;
  }
  #saldo.cambio { animation: pulso .35s ease-out; }
  @keyframes pulso {
    0% { transform: scale(1.04); }
    100% { transform: scale(1); }
  }

  /* Controles */
  .controles {
    margin-top: 24px;
    display: grid;
    grid-template-columns: 1fr auto auto;
    gap: 12px;
    align-items: stretch;
  }
  .campo {
    display: flex;
    align-items: center;
    background: var(--papel);
    border: 2px solid var(--linea);
    border-radius: 6px;
    padding: 0 16px;
    min-width: 0;
  }
  .campo:focus-within { border-color: var(--tinta); }
  .campo span { color: var(--tinta-suave); font-weight: 600; margin-right: 8px; }
  .campo input {
    flex: 1;
    min-width: 0;
    border: 0;
    outline: 0;
    background: transparent;
    color: var(--tinta);
    font: inherit;
    font-size: 1.4rem;
    font-weight: 600;
    padding: 14px 0;
    font-variant-numeric: tabular-nums;
  }
  .campo input::placeholder { color: var(--tinta-suave); opacity: .6; }

  .boton {
    font: inherit;
    font-size: 2rem;
    font-weight: 800;
    line-height: 1;
    width: 72px;
    border-radius: 6px;
    border: 2px solid currentColor;
    cursor: pointer;
    transition: background-color .15s, color .15s;
  }
  .boton.mas { color: var(--suma); background: var(--suma-fondo); }
  .boton.menos { color: var(--resta); background: var(--resta-fondo); }
  .boton.mas:hover { background: var(--suma); color: var(--papel); }
  .boton.menos:hover { background: var(--resta); color: var(--papel); }
  .boton:focus-visible, .campo input:focus-visible {
    outline: 3px solid var(--tinta);
    outline-offset: 2px;
  }

  #mensaje {
    min-height: 1.4em;
    margin: 10px 2px 0;
    font-size: .95rem;
    color: var(--resta);
  }

  /* Historial */
  .historial { margin-top: 28px; }
  .historial h2 { font-size: 1.15rem; margin: 0 0 12px; }
  ul { list-style: none; margin: 0; padding: 0; }
  li {
    display: grid;
    grid-template-columns: auto 1fr auto;
    gap: 6px 14px;
    align-items: center;
    padding: 14px 4px;
    border-bottom: 1px solid var(--linea);
  }
  .marca {
    width: 34px; height: 34px;
    border-radius: 50%;
    display: grid; place-items: center;
    font-weight: 800; font-size: 1.3rem;
  }
  li.suma .marca { background: var(--suma-fondo); color: var(--suma); }
  li.resta .marca { background: var(--resta-fondo); color: var(--resta); }
  .monto { font-weight: 800; font-size: 1.15rem; font-variant-numeric: tabular-nums; }
  li.suma .monto { color: var(--suma); }
  li.resta .monto { color: var(--resta); }
  .fecha { color: var(--tinta-suave); font-size: .85rem; }
  .despues { text-align: right; font-size: .85rem; color: var(--tinta-suave); font-variant-numeric: tabular-nums; }
  .detalle { display: flex; flex-direction: column; }
  .vacio { color: var(--tinta-suave); padding: 18px 4px; }

  #aviso-almacen {
    display: none;
    margin-top: 24px;
    padding: 12px 14px;
    border: 2px solid var(--resta);
    border-radius: 6px;
    color: var(--resta);
    font-size: .9rem;
  }

  @media (max-width: 460px) {
    .controles { grid-template-columns: 1fr 1fr; }
    .campo { grid-column: 1 / -1; }
    .boton { width: auto; padding: 10px 0; }
    .cuadro { padding: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    #saldo.cambio { animation: none; }
    .boton { transition: none; }
  }
</style>
</head>
<body>
<main>
  <h1>Contador de dólares</h1>

  <section class="saldo" aria-label="Saldo actual">
    <div class="signo" aria-hidden="true">$</div>
    <div class="cuadro">
      <small>Saldo actual</small>
      <div id="saldo" aria-live="polite">0.00</div>
    </div>
  </section>

  <section class="controles" aria-label="Modificar saldo">
    <label class="campo">
      <span>$</span>
      <input id="monto" type="text" inputmode="decimal" autocomplete="off" placeholder="0.00" aria-label="Monto en dólares">
    </label>
    <button class="boton mas" id="btn-mas" type="button" aria-label="Agregar al saldo">+</button>
    <button class="boton menos" id="btn-menos" type="button" aria-label="Restar del saldo">&minus;</button>
  </section>
  <div id="mensaje" role="status"></div>

  <section class="historial" aria-label="Historial">
    <h2>Historial</h2>
    <ul id="lista"></ul>
  </section>

  <div id="aviso-almacen">
    Tu navegador no permite guardar datos en esta página (por ejemplo, en modo privado). El saldo funciona, pero se perderá al cerrar la pestaña.
  </div>
</main>

<script>
(function () {
  var CLAVE = "contador-dolares-v1";
  var estado = { centavos: 0, historial: [] };
  var puedeGuardar = true;

  var $saldo = document.getElementById("saldo");
  var $monto = document.getElementById("monto");
  var $mensaje = document.getElementById("mensaje");
  var $lista = document.getElementById("lista");

  var formatoDinero = new Intl.NumberFormat("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  var formatoFecha = new Intl.DateTimeFormat("es-MX", { dateStyle: "medium", timeStyle: "short" });

  function dinero(centavos) { return formatoDinero.format(centavos / 100); }

  function cargar() {
    try {
      var crudo = localStorage.getItem(CLAVE);
      if (crudo) {
        var datos = JSON.parse(crudo);
        if (datos && typeof datos.centavos === "number" && Array.isArray(datos.historial)) {
          estado = datos;
        }
      }
    } catch (e) {
      puedeGuardar = false;
    }
  }

  function guardar() {
    try {
      localStorage.setItem(CLAVE, JSON.stringify(estado));
    } catch (e) {
      puedeGuardar = false;
      document.getElementById("aviso-almacen").style.display = "block";
    }
  }

  // Convierte texto como "1,250.50" o "20" a centavos enteros (evita errores de decimales)
  function leerMonto(texto) {
    var limpio = texto.replace(/[\s$,]/g, "");
    if (!/^\d+(\.\d{1,2})?$/.test(limpio)) return null;
    var partes = limpio.split(".");
    var centavos = parseInt(partes[0], 10) * 100 + (partes[1] ? parseInt((partes[1] + "0").slice(0, 2), 10) : 0);
    if (!isFinite(centavos) || centavos <= 0 || centavos > 9e13) return null;
    return centavos;
  }

  function avisar(texto) { $mensaje.textContent = texto || ""; }

  function dibujar(animar) {
    $saldo.textContent = dinero(estado.centavos);
    if (animar) {
      $saldo.classList.remove("cambio");
      void $saldo.offsetWidth;
      $saldo.classList.add("cambio");
    }

    $lista.innerHTML = "";
    if (estado.historial.length === 0) {
      var vacio = document.createElement("li");
      vacio.className = "vacio";
      vacio.style.display = "block";
      vacio.textContent = "Aún no hay movimientos. Escribe un monto y usa + o − para empezar.";
      $lista.appendChild(vacio);
      return;
    }
    estado.historial.forEach(function (m) {
      var li = document.createElement("li");
      li.className = m.tipo === "suma" ? "suma" : "resta";

      var marca = document.createElement("div");
      marca.className = "marca";
      marca.textContent = m.tipo === "suma" ? "+" : "\u2212";

      var detalle = document.createElement("div");
      detalle.className = "detalle";
      var monto = document.createElement("span");
      monto.className = "monto";
      monto.textContent = (m.tipo === "suma" ? "+ $" : "\u2212 $") + dinero(m.centavos);
      var fecha = document.createElement("span");
      fecha.className = "fecha";
      fecha.textContent = formatoFecha.format(new Date(m.fecha));
      detalle.appendChild(monto);
      detalle.appendChild(fecha);

      var despues = document.createElement("div");
      despues.className = "despues";
      despues.textContent = "Saldo: $" + dinero(m.saldoDespues);

      li.appendChild(marca);
      li.appendChild(detalle);
      li.appendChild(despues);
      $lista.appendChild(li);
    });
  }

  function mover(tipo) {
    var centavos = leerMonto($monto.value);
    if (centavos === null) {
      avisar("Escribe un monto válido mayor a 0, por ejemplo 25 o 25.50.");
      $monto.focus();
      return;
    }
    if (tipo === "resta" && centavos > estado.centavos) {
      avisar("No puedes restar más de lo que tienes. Saldo actual: $" + dinero(estado.centavos) + ".");
      $monto.focus();
      return;
    }
    estado.centavos += tipo === "suma" ? centavos : -centavos;
    estado.historial.unshift({
      tipo: tipo,
      centavos: centavos,
      saldoDespues: estado.centavos,
      fecha: new Date().toISOString()
    });
    guardar();
    avisar("");
    $monto.value = "";
    $monto.focus();
    dibujar(true);
  }

  document.getElementById("btn-mas").addEventListener("click", function () { mover("suma"); });
  document.getElementById("btn-menos").addEventListener("click", function () { mover("resta"); });
  $monto.addEventListener("keydown", function (e) {
    if (e.key === "Enter") { e.preventDefault(); mover("suma"); }
  });
  $monto.addEventListener("input", function () { avisar(""); });

  cargar();
  if (!puedeGuardar) document.getElementById("aviso-almacen").style.display = "block";
  dibujar(false);
})();
</script>
</body>
</html>
